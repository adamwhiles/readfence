[package]
name = "readfence"
version = "0.4.2"
edition = "2024"
description = "A clean, modern Markdown viewer for developers"
authors = ["SignalPeak Media LLC"]
license = "MIT"
repository = "https://github.com/adamwhiles/readfence"
homepage = "https://readfence.com"
keywords = ["markdown", "viewer", "developer-tools", "iced"]
categories = ["text-editors"]
readme = "README.md"

[package.metadata.wix]
upgrade-guid = "04A82975-A2C4-4F47-90C7-951F2401DC6D"
path-guid = "22F98BE6-E414-4EF1-A2C6-6B67650A1A6E"
license = false
eula = false

[[bin]]
name = "readfence"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14.0", features = ["advanced", "tokio", "image", "svg"] }
pulldown-cmark = "0.12.2"
unicode-width = "0.2"
rfd = "0.17.2"
open = "5"
tokio = { version = "1", features = ["fs", "time"] }
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "6"
ureq = { version = "2", default-features = false, features = ["tls"] }
# Self-update: decode the release archive and swap the running executable.
lzma-rs = "0.3"
tar = "0.4"
sha2 = "0.10"
self-replace = "1"

[target.'cfg(windows)'.dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
